<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%97%93%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>Manage Users · Smart Calendar Task Board</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Quicksand:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="th-white">
<script>try{var t=localStorage.getItem("sct_theme");if(["white","dark","pink","cepalco"].indexOf(t)>-1)document.body.className=document.body.className.replace(/\bth-\w+/,"th-"+t)}catch(e){}</script>
<header class="panel top"><div><h1>👥 Manage Users</h1><p class="sub">Admin only · create, edit, disable and delete accounts</p></div>
<div class="row"><a class="btn" href="index.html">← Back to calendar</a><button class="btn" id="bx">⬇ Export Backup</button><button class="btn" id="bi">⬆ Import Backup</button><input type="file" id="bf" accept=".json" hidden><button class="btn" onclick="logout()">Log out</button></div></header>
<main class="panel">
  <div id="warn" class="warn" hidden>⚠️ You are still using the default admin password. Edit the admin account below and set a new one.</div>
  <h3 id="ft">Add user</h3>
  <form id="f" class="fm" style="margin:10px 0 16px" autocomplete="off">
    <input id="fu" placeholder="Username" aria-label="Username" autocapitalize="none" required pattern="[A-Za-z0-9_.\-]{3,30}" title="3–30 letters, numbers, . _ -">
    <input id="fn" placeholder="Display name" aria-label="Display name" maxlength="60">
    <input id="fp" aria-label="Password" type="password" placeholder="Password" autocomplete="new-password">
    <select id="fr"><option value="user">User</option><option value="admin">Admin</option></select>
    <label style="font-size:.8rem;font-weight:700"><input type="checkbox" id="fa" checked> Active</label>
    <div class="row" style="margin:0"><button class="btn pri" type="submit" id="fs">＋ Add</button><button class="btn" type="button" id="fc" hidden>Cancel</button></div>
  </form>
  <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Username</th><th>Name</th><th>Role</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="auth.js"></script>
<script>
const $=s=>document.querySelector(s);let ME,editId=null,US=[];
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const d=document.createElement('div');d.textContent=m;$('#toast').append(d);setTimeout(()=>d.remove(),3000)};
const fail=x=>{if(x.status===401)location.replace('login.html');else toast(x.message)};
async function load(){try{US=(await api('/api/users')).users;render()}catch(x){fail(x)}}
function render(){
  $('#warn').hidden=!US.some(u=>u.id===ME.id&&u.mustChange);
  $('#tb').innerHTML=US.map(u=>`<tr><td><b>${esc(u.username)}</b>${u.id===ME.id?' <span class="tag">you</span>':''}</td><td>${esc(u.name)}</td>
  <td><span class="tag">${u.role}</span></td><td>${u.active?'🟢 Active':'⚪ Disabled'}</td><td>${u.created||''}</td>
  <td><button class="mini" data-e="${u.id}">✏️ Edit</button> <button class="mini" data-d="${u.id}">🗑 Delete</button></td></tr>`).join('');
}
function reset(){editId=null;$('#f').reset();$('#fa').checked=true;$('#fu').disabled=false;$('#fp').required=true;$('#fp').placeholder='Password';$('#ft').textContent='Add user';$('#fs').textContent='＋ Add';$('#fc').hidden=true}
$('#fc').onclick=reset;
$('#tb').onclick=async e=>{
  const eb=e.target.closest('[data-e]'),db=e.target.closest('[data-d]');
  if(eb){const u=US.find(x=>x.id===eb.dataset.e);editId=u.id;$('#fu').value=u.username;$('#fu').disabled=true;$('#fn').value=u.name;$('#fp').value='';
    $('#fp').required=false;$('#fp').placeholder='New password (blank = keep)';$('#fr').value=u.role;$('#fa').checked=u.active;
    $('#ft').textContent='Edit '+u.username;$('#fs').textContent='💾 Save';$('#fc').hidden=false;scrollTo({top:0,behavior:'smooth'})}
  if(db){const u=US.find(x=>x.id===db.dataset.d);
    if(!confirm(`Delete user "${u.username}" and their boards?`))return;
    try{await api('/api/users/'+u.id,'DELETE');toast('User deleted');load()}catch(x){fail(x)}}
};
$('#f').onsubmit=async e=>{
  e.preventDefault();const pw=$('#fp').value;
  if(pw&&pw.length<6)return toast('Password must be at least 6 characters.');
  const b={name:$('#fn').value,role:$('#fr').value,active:$('#fa').checked};
  try{
    if(editId){if(pw)b.password=pw;await api('/api/users/'+editId,'PUT',b);toast('User updated')}
    else{b.username=$('#fu').value;b.password=pw;await api('/api/users','POST',b);toast('User added')}
    reset();load();
  }catch(x){fail(x)}
};
$('#bx').onclick=async()=>{try{const d=await api('/api/backup');const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));
  a.download='Taskboard_Full_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Full backup saved (all users + boards)')}catch(x){fail(x)}};
$('#bi').onclick=()=>$('#bf').click();
$('#bf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{const p=JSON.parse(r.result);
    if(!confirm('Restore this backup? It REPLACES all current users and boards.'))return;
    await api('/api/backup','POST',p);toast('Backup restored');ME=(await currentUser())?.user;if(!ME)return logout();load()}
    catch(x){toast(x instanceof SyntaxError?'Invalid backup file':x.message)}};r.readAsText(f)};
(async()=>{const m=await currentUser();
  if(!m)return location.replace('login.html');
  ME=m.user;if(ME.role!=='admin')return location.replace('index.html');load()})();
</script></body></html>
