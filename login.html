<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%97%93%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>Log in · Smart Calendar Task Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Quicksand:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body class="th-white login-wrap">
<script src="auth.js"></script>
<form class="panel login" id="f">
  <div style="text-align:center"><div class="logo">🗓️</div><h1>Smart Task Board</h1><p class="sub">Log in to open your calendar</p></div>
  <input id="u" placeholder="Username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus aria-label="Username">
  <div class="pw"><input id="p" type="password" placeholder="Password" autocomplete="current-password" required aria-label="Password"><button type="button" id="eye" aria-label="Show password" title="Show password">👁</button></div>
  <div id="err" class="bad msg" role="alert"></div>
  <button class="btn pri" type="submit" id="go">Log in</button>
</form>
<script>
(async()=>{
  const $=id=>document.getElementById(id),err=$('err'),btn=$('go');
  $('eye').onclick=()=>{const h=$('p').type==='password';$('p').type=h?'text':'password';$('eye').setAttribute('aria-label',h?'Hide password':'Show password')};
  $('f').onsubmit=async e=>{
    e.preventDefault();err.textContent='';btn.disabled=true;btn.textContent='Logging in…';
    try{await login($('u').value,$('p').value);location.href='index.html'}
    catch(x){err.textContent=x.status===0?'Cannot reach the server. Check your connection (and that the site is deployed with Netlify Functions).':x.message;btn.disabled=false;btn.textContent='Log in';$('p').select()}
  };
  try{if(localStorage.getItem(TK)&&await currentUser())location.replace('index.html')}catch(e){} // offline: just show the form
})();
</script></body></html>
